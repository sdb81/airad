<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Resilient Assessment Designer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      background: #f5f5f3;
      color: #1b1918;
      min-height: 100vh;
      padding: 0 0 48px;
    }

    .hidden {
      display: none;
    }

    .header-bar {
      background: #bc0031;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .uva-logo-wrap {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .uva-logo-wrap img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .header-text {
      flex: 1;
    }

    .header-text h1 {
      font-family: "Source Serif 4", "Times New Roman", serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .header-text .course-subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 3px;
      font-style: italic;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-save-btn {
      padding: 8px 18px;
      background: #ffffff;
      color: #bc0031;
      border: 2px solid #ffffff;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      white-space: nowrap;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .header-save-btn:hover {
      background: #fce5eb;
      border-color: #ffffff;
      color: #840022;
    }

    .header-reset-btn {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      white-space: nowrap;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      transition: background 0.15s, border-color 0.15s;
    }

    .header-reset-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffffff;
    }

    .lang-switcher {
      display: flex;
      border-radius: 3px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.7);
      flex-shrink: 0;
    }

    .lang-btn {
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    .lang-btn.active {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .lang-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .main {
      max-width: 760px;
      margin: 28px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 4px;
      padding: 22px 24px;
      box-shadow: 0 1px 3px rgba(27, 25, 24, 0.1);
      border-top: 3px solid #bc0031;
    }

    .card h2 {
      font-family: "Source Serif 4", "Times New Roman", serif;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1b1918;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-header-row h2 {
      margin-bottom: 0;
    }

    .help-btn {
      padding: 4px 10px;
      font-size: 0.86rem;
      line-height: 1;
      border: none;
      cursor: pointer;
    }

    .course-title-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d7d6d4;
      border-radius: 3px;
      font-size: 0.95rem;
      background: #f5f5f3;
      color: #1b1918;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
    }

    .course-title-input:focus {
      outline: 2px solid #bc0031;
      outline-offset: 1px;
    }

    .add-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .add-row select,
    .add-row input {
      padding: 9px 12px;
      border: 1px solid #d7d6d4;
      border-radius: 3px;
      font-size: 0.88rem;
      background: #f5f5f3;
      color: #1b1918;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
    }

    .add-row select:focus,
    .add-row input:focus {
      outline: 2px solid #bc0031;
      outline-offset: 1px;
    }

    .add-row select {
      flex: 2;
      min-width: 200px;
    }

    .add-row input[type="number"] {
      flex: 0 0 80px;
      min-width: 60px;
      max-width: 90px;
    }

    .add-row input[type="text"] {
      flex: 2;
      min-width: 120px;
    }

    .add-row button {
      flex: 0 0 120px;
      height: 36px;
      padding: 0 16px;
      background: #bc0031;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 0.86rem;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: background 0.15s;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .add-row button:hover {
      background: #840022;
    }

    .add-row-labels {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      margin-bottom: 4px;
      align-items: flex-end;
    }

    .add-row-labels span {
      font-size: 0.75rem;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .add-row-labels .lbl-type {
      flex: 2;
      min-width: 200px;
      text-align: left;
    }

    .add-row-labels .lbl-pct {
      flex: 0 0 80px;
      min-width: 60px;
      max-width: 90px;
      text-align: center;
    }

    .add-row-labels .lbl-note {
      flex: 2;
      min-width: 120px;
      text-align: left;
    }

    .add-row-labels .lbl-btn {
      flex: 0 0 110px;
    }

    #assessment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .assessment-item {
      border-radius: 3px;
      border-left: 4px solid #d7d6d4;
      background: #f5f5f3;
      overflow: hidden;
    }

    .assessment-item.high {
      border-left-color: #bc0031;
      background: #faebef;
    }

    .assessment-item.medium {
      border-left-color: #e98300;
      background: #fdf5eb;
    }

    .assessment-item.low {
      border-left-color: #257835;
      background: #eef4ef;
    }

    .item-main-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }

    .item-labels {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 160px;
      gap: 2px;
    }

    .item-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #1b1918;
    }

    .item-note-input {
      font-size: 0.78rem;
      color: #555;
      font-style: italic;
      border: none;
      border-bottom: 1px dashed #c0bdbb;
      background: transparent;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      width: 100%;
      padding: 1px 2px;
      outline: none;
    }

    .item-note-input:focus {
      border-bottom-color: #bc0031;
    }

    .item-note-input::placeholder {
      color: #b0aba8;
    }

    .item-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .badge-high {
      background: #ebb3c1;
      color: #840022;
    }

    .badge-medium {
      background: #f8dab3;
      color: #a45c00;
    }

    .badge-low {
      background: #b7c6b0;
      color: #1a5425;
    }
    
   .exposure-group {
      margin-top: 16px;
    }

    .exposure-group-header {
      margin-bottom: 6px;
    }

    .exposure-item {
      padding: 8px 0;
      border-top: 1px solid #e6e5e3;
    }

    .exposure-item:first-of-type {
      border-top: none;
    }

    .exposure-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .exposure-item p {
      font-size: 0.83rem;
      color: #555;
      line-height: 1.5;
    }

    .item-pct-input {
      width: 56px;
      padding: 5px 8px;
      border: 1px solid #d7d6d4;
      border-radius: 3px;
      font-size: 0.88rem;
      text-align: center;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
    }

    .item-pct-input:focus {
      outline: 2px solid #bc0031;
      outline-offset: 1px;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #a8a29f;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 3px;
      transition: color 0.15s;
    }

    .remove-btn:hover {
      color: #bc0031;
    }

    .item-toggles {
      padding: 0 14px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-label {
      font-size: 0.8rem;
      color: #555;
      min-width: 130px;
    }

    .toggle-btn-group {
      display: flex;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #d7d6d4;
    }

    .toggle-btn {
      padding: 4px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #a8a29f;
      transition: background 0.15s, color 0.15s;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
    }

    .toggle-btn:first-child {
      border-right: 1px solid #d7d6d4;
    }

    .toggle-btn.active-yes {
      background: #257835;
      color: #fff;
    }

    .toggle-btn.active-no {
      background: #bc0031;
      color: #fff;
    }

    .toggle-note {
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 3px;
      margin-top: 2px;
    }

    .toggle-note.note-info {
      background: #f3f4f6;
      color: #374151;
      border-left: 3px solid #d1d5db;
    }

    .toggle-note.note-success {
      background: #eef4ef;
      color: #1a5425;
      border-left: 3px solid #257835;
    }

    .toggle-note.note-warn {
      background: #fdf5eb;
      color: #a45c00;
      border-left: 3px solid #e98300;
    }

    .empty-state {
      text-align: center;
      color: #a8a29f;
      font-size: 0.85rem;
      padding: 18px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e6e5e3;
    }

    .total-label {
      font-weight: 600;
    }

    .total-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .total-ok {
      color: #257835;
    }

    .total-warn {
      color: #e98300;
    }

    .total-error {
      color: #bc0031;
    }

    .score-section {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .gauge-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      flex-shrink: 0;
    }

    .gauge-wrap svg {
      width: 88px;
      height: 88px;
    }

    .score-desc {
      flex: 1;
      min-width: 180px;
    }

    .score-desc .verdict {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .score-desc p {
      font-size: 0.83rem;
      color: #555;
      line-height: 1.55;
    }

    .breakdown-bar {
      height: 12px;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      margin-bottom: 7px;
      background: #e6e5e3;
    }

    .bar-high {
      background: #bc0031;
    }

    .bar-medium {
      background: #e98300;
    }

    .bar-low {
      background: #257835;
    }

    .breakdown-legend {
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      color: #555;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 13px;
      border-radius: 3px;
      font-size: 0.83rem;
      line-height: 1.55;
    }

    .msg-warn {
      background: #fdf5eb;
      border-left: 4px solid #e98300;
    }

    .msg-danger {
      background: #faebef;
      border-left: 4px solid #bc0031;
    }

    .msg-success {
      background: #eef4ef;
      border-left: 4px solid #257835;
    }

    .msg-info {
      background: #ebf1f6;
      border-left: 4px solid #004e92;
    }

    .msg-icon {
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .no-assessments-note {
      text-align: center;
      color: #a8a29f;
      font-size: 0.85rem;
      padding: 10px 0;
    }

    .consult-card {
      background: #fff;
      border-radius: 4px;
      padding: 22px 24px;
      box-shadow: 0 1px 3px rgba(27, 25, 24, 0.1);
      border-top: 3px solid #bc0031;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .consult-card p {
      font-size: 0.95rem;
      color: #1b1918;
      font-weight: 600;
      flex: 1;
      min-width: 200px;
    }

    .consult-btn {
      display: inline-block;
      padding: 10px 22px;
      background: #bc0031;
      color: #fff;
      border-radius: 3px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: background 0.15s;
      white-space: nowrap;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
    }

    .consult-btn:hover {
      background: #840022;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .intro-box {
      max-width: 520px;
      background: #ffffff;
      border-radius: 4px;
      border-top: 3px solid #bc0031;
      padding: 28px 28px 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
    }

    .intro-box h2 {
      font-family: "Source Serif 4", "Times New Roman", serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1b1918;
    }

    .intro-box p {
      margin-bottom: 20px;
      color: #444;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .intro-box-scrollable {
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    #exposure-help-body {
      flex: 1;
      overflow-y: auto;             
      margin-bottom: 16px;          
    }

    .intro-btn {
      display: inline-block;
      padding: 9px 22px;
      background: #bc0031;
      color: #fff;
      border-radius: 3px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      transition: background 0.15s;
    }

    .intro-btn:hover {
      background: #840022;
    }

    .avv-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 3px;
      background: #e5e7eb;
      color: #6b7280;
}
    @media (max-width: 600px) {
      .header-bar {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .header-right {
        width: 100%;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .header-save-btn,
      .header-reset-btn {
        font-size: 0.78rem;
        padding: 6px 12px;
      }

      .main {
        margin-top: 16px;
        padding: 0 10px;
      }

      .card {
        padding: 16px 14px;
      }

      .add-row {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .add-row select {
        flex: 1 1 calc(100% - 90px);
        min-width: 0;
      }

      .add-row input[type="number"] {
        flex: 0 0 70px;
        max-width: 70px;
      }

      .add-row input[type="text"] {
        flex: 1 1 100%;
      }

      .add-row button {
        flex: 1 1 100%;
        max-width: unset;
      }

      .add-row-labels {
        display: none;
      }

      .item-main-row {
        flex-wrap: wrap;
        gap: 8px;
      }

      .item-labels {
        min-width: 0;
        width: 100%;
      }

      .item-pct-input {
        width: 50px;
      }

      .consult-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .consult-btn {
        width: 100%;
        text-align: center;
      }

      .score-section {
        flex-direction: column;
        align-items: flex-start;
      }
    } 
  </style>
</head>
<body>

  <!-- Intro overlay -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-box">
      <h2 id="intro-title"></h2>
      <p id="intro-body"></p>
      <button type="button" class="intro-btn" onclick="dismissIntro()" id="intro-cta"></button>
    </div>
  </div>

  <!-- Exposure help overlay -->
  <div id="exposure-help-overlay" class="intro-overlay">
    <div class="intro-box intro-box-scrollable">
      <h2 id="exposure-help-title"></h2>
      <div id="exposure-help-body"></div>
      <button type="button" class="intro-btn" onclick="closeExposureHelp()">Close</button>
    </div>
  </div>

  <!-- Header -->
  <div class="header-bar">
    <div class="uva-logo-wrap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Amsterdamuniversitylogo.svg" alt="UvA logo" />
    </div>
    <div class="header-text">
      <h1 id="header-title"></h1>
      <div class="course-subtitle" id="header-subtitle"></div>
    </div>
    <div class="header-right">
      <button type="button" id="header-reset-btn" class="header-reset-btn hidden" onclick="resetState()"></button>
      <button type="button" id="header-save-btn"  class="header-save-btn hidden"  onclick="saveResult()"></button>
      <div class="lang-switcher">
        <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-nl" onclick="setLang('nl')">NL</button>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">

    <!-- Course title -->
    <div class="card">
      <h2 id="label-course-title"></h2>
      <input type="text" class="course-title-input" id="course-title" oninput="updateCourseTitle()" />
    </div>

    <!-- Add component -->
    <div class="card hidden" id="add-card">
      <h2 id="label-add-component"></h2>
      <div class="add-row-labels">
        <span class="lbl-type"  id="label-type"></span>
        <span class="lbl-pct"   id="label-weight"></span>
        <span class="lbl-note"  id="label-note-col"></span>
        <span class="lbl-btn"></span>
      </div>
      <div class="add-row">
        <select id="assessment-select"></select>
        <input type="number" id="pct-input"  min="1" max="100" />
        <input type="text"   id="note-input" maxlength="60" />
        <button onclick="addAssessment()" id="btn-add"></button>
      </div>
    </div>

    <!-- Assessment structure -->
    <div class="card hidden" id="structure-card">
      <h2 id="label-structure"></h2>
      <div id="assessment-list"></div>
    </div>

    <!-- Feedback -->
    <div class="card hidden" id="feedback-card">
    <div class="card-header-row">
      <h2 id="label-feedback"></h2>
      <button
        type="button"
        class="consult-btn help-btn"
        id="exposure-help-btn"
        onclick="openExposureHelp()"
        title="How are exposure scores decided?"
      >
        ?
      </button>
    </div>
    <div id="feedback-content"></div>
  </div>

    <!-- Consult CTA -->
    <div class="consult-card">
      <p id="consult-text"></p>
      <a
        class="consult-btn"
        id="consult-btn"
        href="https://tlc.uva.nl/en/article/ai-consultancy/"
        target="_blank"
        rel="noopener"
      ></a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="main.js"></script>

</body>
</html>
